version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hermespg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: appdb
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
      POSTGRES_HOST_AUTH_METHOD: "md5"
    command: postgres -c password_encryption=md5
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 5

  hermespg:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermespg:latest
    container_name: hermespg-proxy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: secretpassword
      PGDATABASE: appdb
      HERMES_PORT: 6432
      HERMES_MAX_CONNS: 20
      HERMES_MAX_QUEUE: 5000
      HERMES_TIMEOUT_MS: 15000
      HERMES_IDLE_TX_TIMEOUT_MS: 8000
      HERMES_VERBOSE: "false"

volumes:
  pgdata:
