name: Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Static Binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            binary_name: hermespg-linux-amd64
          - arch: arm64
            platform: linux/arm64
            binary_name: hermespg-linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Compile static binary in Alpine container
        run: |
          mkdir -p dist
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            nimlang/nim:2.0.12-alpine \
            sh -c "apk add --no-cache gcc musl-dev git && git config --global --add safe.directory '*' && nimble install -y --depsOnly && nim c -d:danger --opt:speed --passC:'-flto -fomit-frame-pointer -ffunction-sections -fdata-sections' --passL:'-flto -static -s -Wl,--gc-sections' -o:dist/${{ matrix.binary_name }} src/hermespg.nim && chmod 777 dist/${{ matrix.binary_name }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: error

  build-darwin:
    name: Build macOS Binaries
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            binary_name: hermespg-darwin-arm64
          - os: macos-13
            arch: amd64
            binary_name: hermespg-darwin-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: iffy/install-nim@v5
        with:
          version: binary:2.0.12

      - name: Install dependencies & compile
        run: |
          mkdir -p dist
          nimble install -y --depsOnly
          nim c -d:danger --opt:speed --passC:"-flto -fomit-frame-pointer" --passL:"-flto" -o:dist/${{ matrix.binary_name }} src/hermespg.nim
          strip dist/${{ matrix.binary_name }}
          chmod +x dist/${{ matrix.binary_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          ls -la
          sha256sum hermespg-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
